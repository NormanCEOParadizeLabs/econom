name: Tâches quotidiennes
on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC chaque jour
  workflow_dispatch:
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Rappels, alertes et hygiène
        run: |
          curl --fail --silent --show-error --max-time 280 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/daily"
