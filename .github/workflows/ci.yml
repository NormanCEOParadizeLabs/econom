name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verifications:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - uses: supabase/setup-cli@v1
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta
      - run: npm test
      - name: Tests de bout en bout
        run: |
          cp .env.ci .env.local
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
